map $uri $asset_cache { default ""; ~^/assets/ "public, max-age=31536000, immutable"; }
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 26m;
    # Only the fixed host gateway is a trusted TLS edge. The edge overwrites
    # X-Real-IP with the connection client address (see infra/tls-edge.conf).
    set_real_ip_from 172.30.0.1;
    real_ip_header X-Real-IP;
    real_ip_recursive off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Verified-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    add_header Cache-Control $asset_cache;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 60s;
    }
    location = /health/ { proxy_pass http://backend:8000; }
    location = /ready/ { proxy_pass http://backend:8000; }
    location /assets/ { expires 1y; }
    location / { expires -1; try_files $uri $uri/ /index.html; }
}
