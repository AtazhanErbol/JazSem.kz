      - in: query
        name: status
        schema:
          type: string
          enum:
          - CANCELLED
          - COMPLETED
          - FAILED
          - PROCESSING
          - QUEUED
        description: |-
          * `QUEUED` - Queued
          * `PROCESSING` - Processing
          * `COMPLETED` - Completed
          * `FAILED` - Failed
          * `CANCELLED` - Cancelled
