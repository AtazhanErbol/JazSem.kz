# Include the location in the institution's HTTPS virtual host with its real
# server_name/certificate. Do not use client-provided XFF/X-Real-IP as identity.
location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Verified-Client-IP "";
    proxy_set_header X-Forwarded-Proto https;
}
