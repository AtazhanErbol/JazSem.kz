# Disposable synthetic lab. Never loads .env, never use with user data.
name: jazsem-acceptance
x-env: &env
  DJANGO_SETTINGS_MODULE: config.settings.production
  DJANGO_SECRET_KEY: synthetic-acceptance-only-never-deploy-this-secret-7482
  MAIL_ENCRYPTION_KEY: ZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWU=
  DATABASE_URL: postgresql://acceptance:synthetic-only@postgres/jazsem_rc_runtime
  REDIS_URL: rediss://:synthetic-only@redis:6379/0
  REDIS_SSL_CA_CERTS: /certs/ca.pem
  SSL_CERT_FILE: /certs/ca.pem
  TRUSTED_SERVICE_NETWORK: 'true'
  DJANGO_ALLOWED_HOSTS: rc.example.test
  FRONTEND_URL: https://rc.example.test:8443
  CSRF_TRUSTED_ORIGINS: https://rc.example.test:8443
  TRUSTED_PROXY_CIDRS: 172.30.0.20/32
  S3_BUCKET: jazsem-acceptance-private
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: synthetic-acceptance
  S3_SECRET_KEY: synthetic-acceptance-only
  EMAIL_HOST: mail
  EMAIL_PORT: '1025'
  EMAIL_USE_TLS: 'true'
  EMAIL_USE_SSL: 'false'
  DEFAULT_FROM_EMAIL: acceptance@example.test
  AI_ENABLED: 'false'
  OPENAI_API_KEY: ''
x-app: &app
  image: jazsem-backend:acceptance
  build: {context: ../backend, target: production}
  environment: *env
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  volumes: [../.runtime/acceptance/certs:/certs:ro]
  mem_limit: 1g
  cpus: 2
services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: acceptance, POSTGRES_PASSWORD: synthetic-only, POSTGRES_DB: jazsem_rc_runtime}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD, pg_isready, -U, acceptance, -d, jazsem_rc_runtime]
      interval: 3s
      timeout: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --port, '0', --tls-port, '6379', --tls-cert-file, /certs/server.pem, --tls-key-file, /certs/server.key, --tls-ca-cert-file, /certs/ca.pem, --tls-auth-clients, 'no', --requirepass, synthetic-only]
    volumes: [../.runtime/acceptance/certs:/certs:ro]
    read_only: true
    tmpfs: [/data, /tmp]
  minio:
    build: {context: minio}
    environment: {MINIO_ROOT_USER: synthetic-acceptance, MINIO_ROOT_PASSWORD: synthetic-acceptance-only}
    volumes: [objects:/data]
  mail:
    image: jazsem-dev:acceptance
    build: {context: ../backend, target: development}
    environment: *env
    command: [python, /acceptance/acceptance_mail.py, --host, 0.0.0.0, --cert, /certs/server.pem, --key, /certs/server.key]
    read_only: true
    tmpfs: [/tmp]
    volumes: [../scripts:/acceptance:ro, ../.runtime/acceptance/certs:/certs:ro]
  backend:
    <<: *app
    networks:
      default: {ipv4_address: 172.30.0.10}
    depends_on:
      postgres: {condition: service_healthy}
  short:
    <<: *app
    environment: {<<: *env, WORKER_ROLE: short}
    command: celery -A config worker --loglevel=info --concurrency=2 --queues=celery --hostname=short@%h
    mem_limit: 768m
    cpus: 1
  heavy:
    <<: *app
    environment: {<<: *env, WORKER_ROLE: heavy}
    command: celery -A config worker --loglevel=info --concurrency=1 --queues=heavy --hostname=heavy@%h --max-tasks-per-child=10 --max-memory-per-child=800000
    cpus: 1
    mem_limit: 1536m
  beat:
    <<: *app
    command: celery -A config beat --loglevel=info --schedule=/tmp/celerybeat-schedule
  web:
    image: jazsem-frontend:acceptance
    build: {context: ../frontend, target: production}
    networks:
      default: {ipv4_address: 172.30.0.20}
    volumes: [../.runtime/acceptance/web.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [backend]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
  edge:
    image: jazsem-frontend:acceptance
    networks:
      default: {ipv4_address: 172.30.0.30, aliases: [rc.example.test]}
    ports: ['127.0.0.1:8443:8443']
    volumes: [./acceptance-edge.conf:/etc/nginx/conf.d/default.conf:ro, ../.runtime/acceptance/certs:/certs:ro]
    depends_on: [web]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
volumes:
  database:
  objects:
networks:
  default:
    ipam:
      config: [{subnet: 172.30.0.0/24, gateway: 172.30.0.1}]
